<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Ascension Inventory</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0; height: 100%;
        background: #0a2c4d; color: #fbfaf7;
        font-family: -apple-system, system-ui, sans-serif;
        display: flex; align-items: center; justify-content: center;
        text-align: center; padding: env(safe-area-inset-top) 24px 0;
      }
      .wrap { max-width: 22rem; }
      .bar { height: 3px; width: 96px; margin: 0 auto 20px;
        background: linear-gradient(90deg, #0a2c4d, #019dc5, #1db9e1); border-radius: 2px; }
      h1 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; color: #c4d8e8; margin: 0; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar"></div>
      <h1>Ascension Inventory</h1>
      <p>Connecting…</p>
      <p style="margin-top:12px;font-size:13px;color:#88a7c4">
        If this screen stays, the app hasn't been pointed at its live server yet.
      </p>
    </div>
  </body>
</html>
