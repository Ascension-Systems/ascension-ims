name: Security baseline
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
# Explicit bash runs every step with `-eo pipefail`. GitHub's unspecified default is
# `bash -e` WITHOUT pipefail, which would let `failing-check | tee log` pass.
defaults:
  run:
    shell: bash
concurrency:
  group: security-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security-baseline:
    name: security-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      PYTHONDONTWRITEBYTECODE: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the candidate without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node from netlify.toml
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Prepare evidence directory
        run: |
          EVIDENCE="$RUNNER_TEMP/ims-evidence"
          echo "EVIDENCE=$EVIDENCE" >> "$GITHUB_ENV"
          mkdir -p "$EVIDENCE"
          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run=$GITHUB_RUN_ID.$GITHUB_RUN_ATTEMPT"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } > "$EVIDENCE/run.txt"

      - name: Install dependencies from the lockfile
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          # Install scripts stay off for every package except the one that needs it:
          # the embedded PostgreSQL binary restores its library symlinks on install.
          npm rebuild @embedded-postgres/linux-x64

      - name: Install verified pinned tools (Semgrep, Gitleaks)
        run: bash security-baseline/ci/install-tools.sh "$RUNNER_TEMP/ascension-tools"

      - name: Repository hygiene (encoding, SQL, routes, secrets)
        run: |
          npm run check:selftest 2>&1 | tee "$EVIDENCE/check-selftest.txt"
          npm run check:all 2>&1 | tee "$EVIDENCE/check-all.txt"

      - name: Typecheck
        run: npm run typecheck 2>&1 | tee "$EVIDENCE/typecheck.txt"

      - name: Lint
        run: npm run lint 2>&1 | tee "$EVIDENCE/lint.txt"

      - name: Database policy tests (ephemeral local PostgreSQL)
        run: npm run verify:local 2>&1 | tee "$EVIDENCE/verify-local.txt"

      - name: Secret scan (full history)
        run: |
          "$RUNNER_TEMP/ascension-tools/gitleaks" git . --redact --no-banner \
            --report-format json --report-path "$EVIDENCE/gitleaks.json"

      - name: Static analysis
        run: |
          "$RUNNER_TEMP/ascension-tools/venv/bin/semgrep" scan \
            --config security-baseline/ci/semgrep.yml --error --metrics off \
            --json --output "$EVIDENCE/semgrep.json" app components lib middleware.ts netlify

      - name: Dependency audit (blocks on high and critical)
        run: |
          npm audit --omit=dev --json > "$EVIDENCE/npm-audit.json" || true
          npm audit --omit=dev --audit-level=high

      - name: Production-only install keeps runtime native modules
        run: |
          # Guards lockfile classification: a production dependency's optional native
          # subtree marked dev-only would be dropped by `npm ci --omit=dev` on deploy.
          prod="$RUNNER_TEMP/prod-install"
          mkdir -p "$prod"
          cp package.json package-lock.json "$prod/"
          (cd "$prod" && npm ci --omit=dev --ignore-scripts --no-fund --no-audit             && node -e "require('sharp')({create:{width:1,height:1,channels:3,background:'#fff'}}).png().toBuffer().then(()=>console.log('sharp ok'))")             2>&1 | tee "$EVIDENCE/prod-install.txt"

      - name: SBOM (CycloneDX)
        if: ${{ always() }}
        run: npm sbom --sbom-format cyclonedx --omit=dev > "$EVIDENCE/sbom.cdx.json"

      - name: Retain evidence even when a check fails
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ims-evidence/
          if-no-files-found: error
          retention-days: 30
# Test-only authority: no deployment, OIDC token, environment or production secrets.
# Netlify deploys separately from main. Merge protection is the ruleset in
# .github/rulesets/default-branch.json, applied in repository settings.
